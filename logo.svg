<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(99,102,241);stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(168,85,247);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(236,72,153);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(34,211,238);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(14,165,233);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
  
  <!-- Paper/Document shape -->
  <rect x="140" y="120" width="200" height="260" rx="12" fill="white" opacity="0.95"/>
  <path d="M 340 120 L 340 150 L 370 180 L 370 380 Q 370 392 358 392 L 152 392 Q 140 392 140 380 L 140 132 Q 140 120 152 120 L 340 120" fill="white" opacity="0.95"/>
  <path d="M 340 120 L 340 168 Q 340 180 352 180 L 370 180" fill="#E0E7FF"/>
  
  <!-- Dollar sign -->
  <text x="256" y="220" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#grad2)" text-anchor="middle">$</text>
  
  <!-- Grid/boxes representing subscriptions -->
  <rect x="165" y="240" width="35" height="35" rx="4" fill="#6366F1"/>
  <rect x="210" y="240" width="35" height="35" rx="4" fill="#F97316"/>
  <rect x="255" y="240" width="35" height="35" rx="4" fill="#22C55E"/>
  
  <rect x="165" y="285" width="35" height="35" rx="4" fill="#3B82F6"/>
  <rect x="210" y="285" width="35" height="35" rx="4" fill="#EAB308"/>
  <rect x="255" y="285" width="35" height="35" rx="4" fill="#22C55E"/>
  
  <!-- Checkmark circle (bottom right) -->
  <circle cx="380" cy="420" r="60" fill="#3B82F6"/>
  <path d="M 355 420 L 370 435 L 405 400" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
