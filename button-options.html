<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Style Options</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  <style>
    body { background: #F8F9FB; }
  </style>
</head>
<body class="p-8">
  <div class="max-w-4xl mx-auto space-y-12">
    <h1 class="text-3xl font-bold text-slate-900 mb-8">Choose Your Button Style</h1>

    <!-- Option 1: Pills with solid active state -->
    <div class="bg-white p-8 rounded-2xl shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Option 1: Pill Style with Solid Active</h2>
      <div class="flex justify-center">
        <div class="inline-flex gap-1 rounded-full bg-slate-100 p-1.5">
          <button class="flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold transition-all bg-slate-900 text-white shadow-md">
            <span class="iconify h-4 w-4" data-icon="ph:grid-four-bold"></span>
            Grid
          </button>
          <button class="flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
            <span class="iconify h-4 w-4" data-icon="ph:dots-six-bold"></span>
            Swarm
          </button>
          <button class="flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
            <span class="iconify h-4 w-4" data-icon="ph:circles-three-bold"></span>
            Bubbles
          </button>
        </div>
      </div>
    </div>

    <!-- Option 2: Underline style -->
    <div class="bg-white p-8 rounded-2xl shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Option 2: Underline Tabs</h2>
      <div class="flex justify-center">
        <div class="inline-flex gap-6 border-b border-slate-200">
          <button class="flex items-center gap-2 px-4 pb-3 text-sm font-semibold transition-all text-slate-900 border-b-2 border-slate-900">
            <span class="iconify h-4 w-4" data-icon="ph:grid-four-bold"></span>
            Grid
          </button>
          <button class="flex items-center gap-2 px-4 pb-3 text-sm font-medium transition-all text-slate-500 hover:text-slate-900 border-b-2 border-transparent hover:border-slate-300">
            <span class="iconify h-4 w-4" data-icon="ph:dots-six-bold"></span>
            Swarm
          </button>
          <button class="flex items-center gap-2 px-4 pb-3 text-sm font-medium transition-all text-slate-500 hover:text-slate-900 border-b-2 border-transparent hover:border-slate-300">
            <span class="iconify h-4 w-4" data-icon="ph:circles-three-bold"></span>
            Bubbles
          </button>
        </div>
      </div>
    </div>

    <!-- Option 3: Segmented control with background slide -->
    <div class="bg-white p-8 rounded-2xl shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Option 3: Segmented Control</h2>
      <div class="flex justify-center">
        <div class="inline-flex gap-0 rounded-xl border border-slate-200 p-1 bg-slate-50">
          <button class="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition-all bg-white text-slate-900 shadow-sm">
            <span class="iconify h-4 w-4" data-icon="ph:grid-four-bold"></span>
            Grid
          </button>
          <button class="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
            <span class="iconify h-4 w-4" data-icon="ph:dots-six-bold"></span>
            Swarm
          </button>
          <button class="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
            <span class="iconify h-4 w-4" data-icon="ph:circles-three-bold"></span>
            Bubbles
          </button>
        </div>
      </div>
    </div>

    <!-- Option 4: Modern gradient with blur -->
    <div class="bg-white p-8 rounded-2xl shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 mb-4">Option 4: Modern Gradient</h2>
      <div class="flex justify-center">
        <div class="inline-flex gap-2">
          <button class="flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-semibold transition-all bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/30">
            <span class="iconify h-4 w-4" data-icon="ph:grid-four-bold"></span>
            Grid
          </button>
          <button class="flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-medium transition-all bg-slate-100 text-slate-700 hover:bg-slate-200">
            <span class="iconify h-4 w-4" data-icon="ph:dots-six-bold"></span>
            Swarm
          </button>
          <button class="flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-medium transition-all bg-slate-100 text-slate-700 hover:bg-slate-200">
            <span class="iconify h-4 w-4" data-icon="ph:circles-three-bold"></span>
            Bubbles
          </button>
        </div>
      </div>
    </div>

    <div class="text-center text-sm text-slate-500 pt-8">
      Pick a style and let me know which option you prefer (1, 2, 3, or 4)
    </div>
  </div>
</body>
</html>
